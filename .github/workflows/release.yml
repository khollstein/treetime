name: Release

# Build the Windows installer when a v* tag is pushed, and attach it to the
# matching GitHub Release. Also runnable manually via workflow_dispatch for
# dry runs (those uploads only become release assets when triggered by a tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed by softprops/action-gh-release to create/update releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate icon
        run: python generate_ico.py

      - name: Build binary with PyInstaller
        run: pyinstaller --noconsole --name Treetime --icon treetime.ico --collect-all pywin32 main.py

      - name: Smoke-test the binary launches
        # Start the exe, wait briefly, then kill it. Catches missing-DLL / import
        # failures that only surface at runtime.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Treetime\Treetime.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "Treetime.exe exited immediately (code $($proc.ExitCode)) — bundle is broken."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Compile installer with Inno Setup
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Rename installer to include version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Rename-Item -Path "installer_output\TreetimeSetup.exe" -NewName "TreetimeSetup-$version.exe"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreetimeSetup
          path: installer_output/*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*.exe
          generate_release_notes: true
